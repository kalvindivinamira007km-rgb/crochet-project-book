<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crochet Project Book</title>
<meta name="description" content="Track crochet projects and yarn, find free patterns by technique, and turn a photo into a colorwork chart.">
<meta name="theme-color" content="#16131a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='30' cy='34' r='22' fill='%23b0365f'/%3E%3Cpath d='M10 28q18-10 38 4M9 38q20-12 40 3M22 13q-8 18 4 40M37 12q11 19 2 40' fill='none' stroke='%23f6dce3' stroke-width='3'/%3E%3Cpath d='M46 6l10 50' stroke='%232a2230' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column of project cards with a sticky tab bar; a slide-up sheet edits one project. */
:root{
  --bg:#f5f3f7; --surface:#ffffff; --sunk:#ece8f0; --ink:#26202d; --muted:#6a6175; --line:#ddd6e4;
  --accent:#17706a; --accent-ink:#ffffff; --berry:#b0365f; --ok:#3b7f45; --warn:#a2650c;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:12px; --rose-ring:#e8b3c2;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16131a; --surface:#211d27; --sunk:#2a2531; --ink:#efeaf4; --muted:#a69db1; --line:#363040;
  --accent:#4cb3ab; --accent-ink:#0f1f1e; --berry:#e57b9f; --ok:#79c483; --warn:#e3a54d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16131a; --surface:#211d27; --sunk:#2a2531; --ink:#efeaf4; --muted:#a69db1; --line:#363040;
  --accent:#4cb3ab; --accent-ink:#0f1f1e; --berry:#e57b9f; --ok:#79c483; --warn:#e3a54d; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
img{max-width:100%}
[hidden]{display:none!important}
.pat-img{max-width:220px;border-radius:10px;border:1px solid var(--line);display:block}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,36px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted);letter-spacing:0;margin-top:6px}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{flex:none;width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--rose-ring)}
@media (max-width:480px){.logo{width:52px;height:52px}}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;margin:16px 0 18px;padding:6px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:600 15px var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs .count{font-family:var(--mono);font-size:12px;opacity:.75;margin-left:4px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--berry)}
.btn.danger.armed{background:var(--berry);color:#fff;border-color:var(--berry)}
.btn.small{padding:5px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.note{background:var(--sunk);border-radius:var(--r);padding:10px 14px;font-size:14px;color:var(--muted);margin-bottom:14px}
.note b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.card:hover{border-color:var(--muted)}
.strip{display:flex;height:10px}
.card .cover{position:relative;height:100px;overflow:hidden;background:var(--sunk)}
.card .cover svg,.card .cover img{width:100%;height:100%;display:block;object-fit:cover}
.strip span{flex:1}
.strip.empty{background:repeating-linear-gradient(45deg,var(--sunk) 0 6px,var(--line) 6px 12px)}
.card .body{padding:12px 14px 14px;display:grid;gap:6px;min-width:0}
.card .name{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid currentColor}
.pill.wishlist{color:var(--muted)} .pill.active{color:var(--accent)} .pill.done{color:var(--ok)}
.pill.example{color:var(--warn)}
.pill.plat{color:var(--berry)}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.empty-state{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);margin-top:14px}
.empty-state h2{color:var(--ink);margin-bottom:6px}
/* list tables */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:14px}
.li{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),transparent 55%)}
.li .t{font-weight:600;overflow-wrap:anywhere}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.buy{font-family:var(--mono);font-weight:500;font-size:15px;text-align:right}
.buy b{color:var(--berry)}
.buy .okk{color:var(--ok)}
/* find */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;display:grid;gap:12px}
.search-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.search-links a{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink);font-weight:600}
.search-links a small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.search-links a:hover{border-color:var(--accent)}
.sites{display:grid;gap:0}
.site{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.site:first-child{border-top:0}
.site a{color:var(--accent);font-weight:600}
.site p{margin:2px 0 0;font-size:13px;color:var(--muted)}
input[type=text],input[type=url],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;min-width:0}
textarea{min-height:90px;resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,6,14,.45);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow-y:auto;border-radius:18px 18px 0 0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:800px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:90%}}
.sheet-head{position:sticky;top:0;background:var(--surface);z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 12px;border-bottom:1px solid var(--line)}
.sec{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sec:last-child{border-bottom:0}
.yarn{display:grid;grid-template-columns:44px 1fr;gap:10px;background:var(--bg);border-radius:10px;padding:10px}
.yarn input[type=color]{width:44px;height:44px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.counter{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center;text-align:center}
.counter button{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-size:28px;font-weight:700;cursor:pointer}
.counter button.plus{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.counter .num{font-family:var(--mono);font-size:44px;line-height:1}
.counter .of{font-size:13px;color:var(--muted)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photo{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;background:var(--sunk)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.link-out{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.link-out a{color:var(--accent);font-weight:600;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:40;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* survey + picture tiles */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.wiz{display:grid;gap:12px;min-width:0}
.wiz>*,#chartArea>*{min-width:0}
.wiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:34px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps i{height:5px;border-radius:9px;background:var(--line);transition:background .3s}
.steps i.on{background:var(--accent)}
.q{font-family:var(--display);font-weight:800;font-size:clamp(24px,4.5vw,32px);line-height:1.1;text-wrap:balance;margin:6px 0 0}
.sub{margin:0}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:13px}
.kw{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
@media (max-width:520px){.kw{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:block;aspect-ratio:4/3;max-width:100%;border:0;padding:0;border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;background:var(--sunk);color:#fff;text-decoration:none;isolation:isolate}
.tile .art{position:absolute;inset:0}
.tile .art svg{width:100%;height:100%;display:block;transition:transform .35s ease}
.tile:hover .art svg,.tile:focus-visible .art svg{transform:scale(1.06)}
.tile .cap{position:absolute;inset:auto 0 0;padding:30px 12px 10px;display:grid;gap:1px;background:linear-gradient(to top,rgba(14,9,18,.88) 35%,rgba(14,9,18,0))}
.tile .cap b{font:600 16px/1.2 var(--display)}
.tile .cap small{font-size:12px;line-height:1.3;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tick,.tile .go{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px}
.tile .tick{background:var(--accent);color:var(--accent-ink);opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.tile[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.tile[aria-pressed="true"] .tick{opacity:1;transform:none}
.tile .go{background:rgba(14,9,18,.55);color:#fff}
.tiles.sm{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tiles.sm .tile{aspect-ratio:1/1;border-radius:12px}
.tiles.sm .cap{padding:20px 8px 7px}
.tiles.sm .cap b{font-size:13px}
@media (prefers-reduced-motion:reduce){.tile .art svg{transition:none}.tile:hover .art svg{transform:none}}
/* make a pattern */
.drop{position:relative;display:block;aspect-ratio:16/7;min-height:180px;max-width:100%;border-radius:16px;overflow:hidden;cursor:pointer;color:#fff;isolation:isolate}
.drop .art{position:absolute;inset:0;opacity:.9}.drop .art svg{width:100%;height:100%;display:block}
.drop::after{content:"";position:absolute;inset:10px;border:2px dashed rgba(255,255,255,.8);border-radius:10px;pointer-events:none}
.drop.over::after{border-style:solid;border-width:3px}
.drop-cap{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:4px;background:rgba(14,9,18,.45)}
.drop-cap b{font:800 clamp(20px,4vw,28px)/1.1 var(--display)}.drop-cap small{font-size:14px;opacity:.9}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tips div{background:var(--sunk);border-radius:12px;padding:12px 14px;display:grid;gap:2px;font-size:14px}
.tips span{color:var(--muted)}
.photo-bar{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px;flex-wrap:wrap}
.photo-bar img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.photo-bar>div{flex:1;min-width:120px}
.tag{display:inline-block;margin-left:6px;font-size:11px;letter-spacing:.02em;text-transform:none;padding:2px 8px;border-radius:99px;border:1px solid currentColor;vertical-align:middle}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}
input[type=range]{width:100%;accent-color:var(--accent);padding:0;border:0;background:none}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.chart-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px;max-height:72vh;margin-top:14px}
.chart-wrap canvas{display:block}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 6px}
.spec>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.spec b{font-size:17px}
details.instr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0}
details.instr summary{cursor:pointer;font-weight:700}
ol.rows{margin:10px 0 0;padding-left:0;list-style:none;font-family:var(--mono);font-size:13px;display:grid;gap:4px;max-height:420px;overflow:auto}
ol.rows li{padding:4px 0;border-top:1px solid var(--line)}
.draft-banner{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:12px;padding:12px 14px;font-size:14px}
.steps-list{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.steps-list li{padding:10px 12px;border-radius:10px;background:var(--bg);display:grid;gap:4px}
.steps-list li.bad{background:color-mix(in srgb,var(--warn) 14%,var(--bg))}
.st-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.st-head .cnt{color:var(--muted)}
.st-flag{font-weight:800}.good .st-flag{color:var(--ok)}.bad .st-flag{color:var(--warn)}
.st-head .linkbtn{margin-left:auto}
.issue{color:var(--warn);font-size:13px;font-weight:600}
.fix{display:grid;gap:8px;margin-top:6px}
.abbr{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 14px;font-size:14px}
.abbr b{font-family:var(--mono);font-weight:500}
.plain-list{margin:0;padding-left:18px;display:grid;gap:4px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#f2c4c8"/><circle cx="30" cy="34" r="18" fill="#b0365f"/><path d="M15 28q15-8 30 4M13 36q17-10 33 3M18 46q12-8 26-2M24 17q-6 15 3 33M35 16q9 16 2 33" fill="none" stroke="#f6dce3" stroke-width="2" stroke-linecap="round"/><path d="M44 12l9 40M44 12q-4 1-3 5" fill="none" stroke="#2a2230" stroke-width="3.5" stroke-linecap="round"/></svg>
    <h1>Crochet Project Book<small>Everything you want to make, the yarn it takes, and where the pattern lives.</small></h1></div>
    <button class="btn primary" id="newBtn" type="button">+ New project</button>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="note"></div>
  <main id="main"></main>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script>
const WEIGHTS=["0 Lace","1 Super Fine (fingering)","2 Fine (sport)","3 Light (DK)","4 Medium (worsted)","5 Bulky","6 Super Bulky","7 Jumbo"];
const FIBERS=["Acrylic","Cotton","Milk cotton","Wool","Merino","Alpaca","Mohair","Bamboo","Chenille","Velvet","Blend","Other"];
const HOOKS=["2.0 mm","2.25 mm (B-1)","2.75 mm (C-2)","3.25 mm (D-3)","3.5 mm (E-4)","3.75 mm (F-5)","4.0 mm (G-6)","4.5 mm (7)","5.0 mm (H-8)","5.5 mm (I-9)","6.0 mm (J-10)","6.5 mm (K-10½)","8.0 mm (L-11)","9.0 mm (M/N-13)","10 mm (N/P-15)","12 mm+"];
const TECHS=[
 {id:"mosaic",name:"Mosaic",q:"mosaic crochet",d:"Bold geometric colorwork"},
 {id:"tapestry",name:"Tapestry",q:"tapestry crochet",d:"Picture colorwork, yarn carried along"},
 {id:"filet",name:"Filet",q:"filet crochet",d:"Lacy mesh with filled-in images"},
 {id:"c2c",name:"C2C",q:"corner to corner c2c crochet",d:"Diagonal tiles for pixel pictures"},
 {id:"amigurumi",name:"Amigurumi",q:"amigurumi crochet",d:"Stuffed toys worked in spirals"},
 {id:"tunisian",name:"Tunisian",q:"tunisian crochet",d:"Long hook, knit-like fabric"},
 {id:"russian",name:"Russian",q:"russian crochet",d:"Fine lace and doilies"},
 {id:"bruges",name:"Bruges lace",q:"bruges lace crochet",d:"Lace built from crochet ribbons"},
 {id:"granny",name:"Granny squares",q:"granny square crochet",d:"Classic squares joined together"},
 {id:"garment",name:"Garments",q:"crochet garment",d:"Tops, cardigans and sweaters"},
 {id:"other",name:"Other",q:"crochet",d:"Any technique"}
];
const STATUS={wishlist:"Wishlist",active:"In progress",done:"Done"};
const GENERAL_SITES=[

async function localUpload(blob){
  if(!/^image\//.test(blob.type||""))throw{code:"local_pdf"};
  const url=URL.createObjectURL(blob);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const s=Math.min(1,1000/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement("canvas");cv.width=Math.round(img.naturalWidth*s);cv.height=Math.round(img.naturalHeight*s);
    const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);
    return{id:cv.toDataURL("image/jpeg",.82),url:""}}
  catch(e){throw{code:"unsupported_type"}}finally{URL.revokeObjectURL(url)}
}

function platform(u){
  u=safeUrl(u); if(!u) return null;
  let h; try{h=new URL(u).hostname.replace(/^(www|m|vm|vt)\./,"")}catch(e){return {name:"Link"}}
  if(/tiktok\./.test(h))return{name:"TikTok"};
  if(/youtube\.|youtu\.be/.test(h))return{name:"YouTube"};
  if(/facebook\.|fb\.watch/.test(h))return{name:"Facebook"};
  if(/pinterest\.|pin\.it/.test(h))return{name:"Pinterest"};
  if(/instagram\./.test(h))return{name:"Instagram"};
  if(/ravelry\./.test(h))return{name:"Ravelry"};
  return{name:h};
}

/* ---------- data ---------- */
async function init(){
  render();
  const c=window.claude;
  if(!c||typeof c.use!=="function"){const d=lsLoad();if(d){state.projects=d.projects||{};state.stash=d.stash||{}}else{seedLocal();try{localStorage.setItem(LS_KEY,JSON.stringify({projects:state.projects,stash:state.stash}))}catch(e){state.note="This browser isn't letting the app save. Private browsing can block it."}}
    state.loaded=true;state.local=true;render();return}
  const timer=setTimeout(()=>{if(!state.live){state.note="Can't reach your saved projects yet. Check your connection; they'll appear when it's back.";render()}},10000);
  db=await c.use("db");
  c.use("assets").then(a=>{assets=a; if(draft) renderSheet()}).catch(()=>{});
  if(!db){clearTimeout(timer);state.loaded=true;state.note="Sign in to Claude to see and save your projects.";render();return}
  let got={p:false,s:false};
  const onErr=e=>{clearTimeout(timer);state.loaded=true;state.note="Couldn't load your data ("+e.code+"). Reload the page to try again.";render()};
  db.collection("projects").onSnapshot(s=>{
    const m={}; s.docs.forEach(d=>m[d.id]=Object.assign({id:d.id},clone(d.data()))); state.projects=m;
    got.p=true; if(!s.metadata.fromCache&&got.s){state.live=true;state.loaded=true;state.note="";clearTimeout(timer)}
    if(got.p&&got.s)state.loaded=true; render();
  },onErr);
  db.collection("stash").onSnapshot(s=>{
    const m={}; s.docs.forEach(d=>m[d.id]=Object.assign({id:d.id},clone(d.data()))); state.stash=m;
    got.s=true; if(!s.metadata.fromCache&&got.p){state.live=true;state.loaded=true;state.note="";clearTimeout(timer)}
    if(got.p&&got.s)state.loaded=true; render();
  },onErr);
}
async function write(coll,id,body){
  const clean=clone(body); delete clean.id; clean.updatedAt=Date.now();
  if(!db){const key=coll==="projects"?"projects":"stash",old=state[key][id];state[key][id]=Object.assign({id},clean);
    if(!lsSave()){if(old)state[key][id]=old;else delete state[key][id];return false}render();return true}
  try{await db.collection(coll).doc(id).set(clean);return true}
  catch(e){toast(e.code==="quota_exceeded"?"Storage is full. Delete something first.":"Couldn't save ("+(e.code||"error")+"). Try again.");return false}
}
async function remove(coll,id){
  if(!db){delete state[coll][id];lsSave();render();return}
  try{await db.collection(coll).doc(id).delete()}catch(e){toast("Couldn't delete. Try again.")}
}

const keyOf=(c,w)=>(c||"").trim().toLowerCase()+"|"+(w||"");
function shopping(){
  const need={};
  Object.values(state.projects).filter(p=>p.status!=="done").forEach(p=>(p.yarns||[]).forEach(y=>{
    if(!y.color&&!y.skeins)return;
    const k=keyOf(y.color,y.weight);
    need[k]=need[k]||{color:y.color||"Unnamed color",hex:y.hex||"#cccccc",weight:y.weight,fiber:y.fiber,skeins:0,projects:[]};
    need[k].skeins+=num(y.skeins); if(!need[k].projects.includes(p.name))need[k].projects.push(p.name||"Untitled");
  }));
  const have={},price={};
  Object.values(state.stash).forEach(s=>{const k=keyOf(s.color,s.weight);have[k]=(have[k]||0)+num(s.skeins);if(num(s.cost))price[k]=num(s.cost)});
  return Object.entries(need).map(([k,n])=>Object.assign(n,{have:have[k]||0,buy:Math.max(0,Math.ceil(n.skeins-(have[k]||0))),price:price[k]||0}))
    .sort((a,b)=>b.buy-a.buy);
}

/* ---------- main render ---------- */
function render(){
  const P=Object.values(state.projects), S=Object.values(state.stash), buyN=shopping().filter(x=>x.buy>0).length;
  const tabs=[["projects","Projects",P.length],["stash","Yarn stash",S.length],["buy","To buy",buyN],["find","Find patterns",null],["make","Make a pattern",null]];
  $("#tabs").innerHTML=tabs.map(([id,l,c])=>`<button role="tab" type="button" data-tab="${id}" aria-selected="${state.tab===id}">${l}${c!=null?`<span class="count">${c}</span>`:""}</button>`).join("");
  $("#note").innerHTML=state.note?`<div class="note">${esc(state.note)}</div>`:"";
  $("#newBtn").textContent=state.tab==="stash"?"+ Add yarn":"+ New project";
  const v={projects:viewProjects,stash:viewStash,buy:viewBuy,find:viewFind,make:()=>viewMake()}[state.tab];
  $("#main").innerHTML=v(P,S);
  if(state.tab==="make"&&typeof afterMakeRender==="function")afterMakeRender();
  if(state.tab==="find"){const i=$("#q");if(i&&state._qFocus){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
}
function exampleBanner(list){
  const n=list.filter(x=>x.example).length; if(!n)return "";
  return `<div class="note spread"><span><b>${n} example${n>1?"s":""}</b> to show how it works. Delete them when you add your own.</span><button class="btn small danger" type="button" data-act="delExamples">Delete examples</button></div>`;
}
function viewProjects(P){
  if(!state.loaded&&!P.length)return `<div class="empty-state"><h2>Loading your projects…</h2></div>`;
  const counts={all:P.length,wishlist:0,active:0,done:0}; P.forEach(p=>counts[p.status||"wishlist"]++);
  const list=P.filter(p=>state.filter==="all"||(p.status||"wishlist")===state.filter)
    .sort((a,b)=>({active:0,wishlist:1,done:2}[a.status||"wishlist"]-{active:0,wishlist:1,done:2}[b.status||"wishlist"])||(b.updatedAt||0)-(a.updatedAt||0));
  const chips=`<div class="chips">${[["all","All"],["active","In progress"],["wishlist","Wishlist"],["done","Done"]].map(([k,l])=>`<button type="button" class="chip" data-filter="${k}" aria-pressed="${state.filter===k}">${l} <span class="mono">${counts[k]}</span></button>`).join("")}</div>`;
  if(!P.length)return chips+`<div class="empty-state"><h2>No projects yet</h2><p>Add something you want to make: its colors, yarn, hook, and the TikTok, YouTube or Pinterest link you found it on.</p><button class="btn primary" type="button" data-act="new">+ New project</button></div>`;
  const backup=state.local?`<div class="panel"><div class="spread"><div><h2>Saved on this device</h2><p class="meta" style="margin:4px 0 0">Your projects and stash live in this browser. Download a backup, then import it on your phone or laptop to copy everything over.</p></div>
    <div class="row"><button class="btn" type="button" data-act="exportData">Download backup</button><label class="btn" for="importFile">Import backup<input class="sr" type="file" id="importFile" accept="application/json,.json"></label></div></div></div>`:"";
  return exampleBanner(P)+chips+`<div class="grid">${list.map(card).join("")||`<p class="meta">Nothing in this list.</p>`}</div>`+backup;
}
function card(p){
  const ys=(p.yarns||[]).filter(y=>y.hex);

  const pl=platform(p.tutorialUrl);
  const prog=num(p.rowTotal)?Math.min(100,Math.round(num(p.rowCount)/num(p.rowTotal)*100)):null;
  return `<button type="button" class="card" data-open="${esc(p.id)}">
    <div class="cover">${(p.photos||[])[0]?`<img src="${esc(blobSrc(p.photos[0]))}" alt="">`:art(p.technique||"other")}</div>
    <div class="strip ${ys.length?"":"empty"}">${ys.map(y=>`<span style="background:${esc(y.hex)}"></span>`).join("")}</div>
    <div class="body">
      <div class="row"><span class="pill ${esc(p.status||"wishlist")}">${STATUS[p.status||"wishlist"]}</span>${p.example?`<span class="pill example">Example</span>`:""}${pl?`<span class="pill plat">${esc(pl.name)}</span>`:""}</div>
      <div class="name">${esc(p.name||"Untitled project")}</div>
      <div class="meta"><span>${esc(techName(p.technique))}</span>${p.hook?`<span class="mono">${esc(p.hook.split(" (")[0])} hook</span>`:""}${skeins?`<span class="mono">${skeins} skein${skeins===1?"":"s"}</span>`:""}</div>
      ${prog!=null?`<div class="meta"><span class="mono">Row ${num(p.rowCount)} / ${num(p.rowTotal)}</span></div><div class="bar"><i style="width:${prog}%"></i></div>`:(num(p.rowCount)?`<div class="meta mono">Row ${num(p.rowCount)}</div>`:"")}
    </div></button>`;
}
function viewStash(P,S){
  if(!state.loaded&&!S.length)return `<div class="empty-state"><h2>Loading your stash…</h2></div>`;
  if(!S.length)return `<div class="empty-state"><h2>Your stash is empty</h2><p>Add the yarn you already own. The To buy tab subtracts it from what your projects need.</p><button class="btn primary" type="button" data-act="newYarn">+ Add yarn</button></div>`;
  const total=S.reduce((a,s)=>a+num(s.skeins),0), value=S.reduce((a,s)=>a+num(s.skeins)*num(s.cost),0);

  <div class="list">${list.map(s=>`<div class="li">
    <span class="sw" style="background-color:${esc(s.hex||"#ccc")}"></span>
    <div style="min-width:0"><div class="t">${esc(s.color||"Unnamed")} ${s.example?`<span class="pill example">Example</span>`:""}</div>
      <div class="meta"><span>${esc(s.weight||"Weight?")}</span>${s.fiber?`<span>${esc(s.fiber)}</span>`:""}${s.brand?`<span>${esc(s.brand)}</span>`:""}${num(s.cost)?`<span class="mono">${num(s.cost).toFixed(2)}/skein</span>`:""}</div>

}
function viewBuy(){
  const L=shopping();

  const toBuy=L.filter(x=>x.buy>0), cost=toBuy.reduce((a,x)=>a+x.buy*x.price,0);
  return `<div class="note">Matched to your stash by <b>color name</b> and <b>yarn weight</b>, so spell colors the same way in both places. Finished projects are left out.</div>
  <div class="meta"><span class="mono">${toBuy.reduce((a,x)=>a+x.buy,0)} skeins to buy</span>${cost?`<span class="mono">≈ ${cost.toFixed(2)} (using stash prices)</span>`:""}</div>
  <div class="list">${L.map(x=>`<div class="li">
    <span class="sw" style="background-color:${esc(x.hex)}"></span>
    <div style="min-width:0"><div class="t">${esc(x.color)}</div>
      <div class="meta"><span>${esc(x.weight||"Weight not set")}</span>${x.fiber?`<span>${esc(x.fiber)}</span>`:""}</div>

    <div class="buy">${x.buy?`<b>Buy ${x.buy}</b>`:`<span class="okk">Covered</span>`}<div class="meta" style="justify-content:flex-end">need ${x.skeins} · have ${x.have}</div></div>
  </div>`).join("")}</div>`;
}
function tile(o){
  const inner=`<span class="art">${o.art}</span><span class="cap"><b>${esc(o.name)}</b>${o.d?`<small>${esc(o.d)}</small>`:""}</span>`;
  if(o.href)return `<a class="tile" href="${esc(o.href)}" target="_blank" rel="noopener">${inner}<span class="go" aria-hidden="true">↗</span></a>`;
  return `<button type="button" class="tile" ${o.attrs} aria-pressed="${!!o.pressed}">${inner}<span class="tick" aria-hidden="true">✓</span></button>`;
}
const byId=(arr,id)=>arr.find(x=>x.id===id)||arr[arr.length-1];
function viewFind(){
  const w=state.wiz;
  if(w.step<4){
    let q,sub,body;
    if(w.step===1){q="Which technique do you want to try?";sub="Tap one to continue.";
      body=`<div class="tiles">${TECHS.map(t=>tile({attrs:`data-wiz="tech" data-val="${t.id}"`,art:art(t.id),name:t.id==="other"?"Not sure yet":t.name,d:t.id==="other"?"Show me all techniques":t.d,pressed:w.tech===t.id})).join("")}</div>`}
    else if(w.step===2){q="What do you want to make?";sub="Tap one. Have something specific in mind? Type it first.";
      body=`<div class="kw"><label class="f" for="kw">Something specific (optional)<input type="text" id="kw" value="${esc(w.kw)}" placeholder="e.g. bunny, sunflower, market tote"></label><button class="btn" type="button" data-act="wizNext">Continue with my words</button></div>
      <div class="tiles">${ITEMS.map(i=>tile({attrs:`data-wiz="item" data-val="${i.id}"`,art:art(i.id==="any"?"other":i.id),name:i.name,d:i.d,pressed:w.item===i.id})).join("")}</div>`}
    else {q="How challenging should it be?";sub="Tap one to see where to look.";
      body=`<div class="tiles">${LEVELS.map(l=>tile({attrs:`data-wiz="level" data-val="${l.id}"`,art:art("lv_"+l.id),name:l.name,d:l.d,pressed:w.level===l.id})).join("")}</div>`}

  }
  const t=byId(TECHS,w.tech),it=byId(ITEMS,w.item),lv=byId(LEVELS,w.level),e=encodeURIComponent;
  const q=[lv.q,t.q,it.q,w.kw].filter(Boolean).join(" ");

    ["google","Google","Blogs and PDFs",`https://www.google.com/search?q=${e(q+" free pattern")}`]
  ];
  const sites=(TECH_SITES[t.id]||[]).concat(GENERAL_SITES);
  return `<section class="wiz">
    <div class="wiz-top"><span class="eyebrow">Your search</span><button class="btn small" type="button" data-act="wizRestart">Start over</button></div>
    <h2 class="q">${esc(summary)}</h2>

      <button class="linkbtn" type="button" data-act="wizEdit" data-step="1">Change technique</button> · <button class="linkbtn" type="button" data-act="wizEdit" data-step="2">Change project</button> · <button class="linkbtn" type="button" data-act="wizEdit" data-step="3">Change level</button></p>
    <h3 style="margin-top:8px">Search on</h3>
    <div class="tiles">${links.map(([k,n,d,u])=>tile({href:u,art:art("p:"+k,t.id),name:n,d})).join("")}</div>
    <div class="panel">
      <h2>Found one you like?</h2>
      <p class="meta" style="margin:0">Paste the link and it goes on your wishlist. TikTok, YouTube, Facebook, Pinterest and Instagram links are saved as the tutorial; anything else as the pattern.</p>

/* ---- color + image helpers ---- */
const WGT=[2,4,3];
const dist=(a,b)=>WGT[0]*(a[0]-b[0])**2+WGT[1]*(a[1]-b[1])**2+WGT[2]*(a[2]-b[2])**2;
function nearestIdx(p,cs){let bi=0,bd=Infinity;for(let i=0;i<cs.length;i++){const d=dist(p,cs[i]);if(d<bd){bd=d;bi=i}}return bi}

const fromHex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));

function colorName(h){const c=fromHex(h);let best=NAMED[0],bd=Infinity;for(const n of NAMED){const d=dist(c,fromHex(n[1]));if(d<bd){bd=d;best=n}}return best[0]}
function paletteNames(pal){const seen={};return pal.map((h,i)=>{let n=colorName(h);seen[n]=(seen[n]||0)+1;if(seen[n]>1)n+=" "+seen[n];return{hex:h,name:n,letter:"ABCDEFGH"[i]}})}
function kmeans(px,k){
  const mean=[0,1,2].map(j=>px.reduce((a,p)=>a+p[j],0)/px.length);
  const cs=[px[nearestIdx(mean,px)].slice()],md=px.map(p=>dist(p,cs[0]));
  while(cs.length<k){let bi=0;for(let i=1;i<px.length;i++)if(md[i]>md[bi])bi=i;if(md[bi]===0)break;cs.push(px[bi].slice());const last=cs[cs.length-1];for(let i=0;i<px.length;i++)md[i]=Math.min(md[i],dist(px[i],last))}
  for(let it=0;it<14;it++){const sum=cs.map(()=>[0,0,0,0]);for(const p of px){const s=sum[nearestIdx(p,cs)];s[0]+=p[0];s[1]+=p[1];s[2]+=p[2];s[3]++}
    let moved=false;sum.forEach((s,j)=>{if(s[3]){const n=[s[0]/s[3],s[1]/s[3],s[2]/s[3]];if(dist(n,cs[j])>1)moved=true;cs[j]=n}});if(!moved)break}

function computeChart(){
  const m=state.make,img=m.img;if(!img)return null;
  const key=[m.w,m.k,m.smooth,m.invert,m.type,m.url].join("|");if(m.chart&&m._key===key)return m.chart;
  const k=(m.type==="filet"||m.type==="mosaic")?2:m.k, rowF=(m.type==="tapestry"||m.type==="mosaic")?1.15:1;
  const W=m.w,H=Math.max(2,Math.min(220,Math.round(W*img.naturalHeight/img.naturalWidth*rowF)));

  while(sw/2>W*2&&sh/2>H*2){const t=document.createElement("canvas");t.width=Math.round(sw/2);t.height=Math.round(sh/2);const tc=t.getContext("2d");tc.imageSmoothingQuality="high";tc.drawImage(src,0,0,t.width,t.height);src=t;sw=t.width;sh=t.height}
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const cx=cv.getContext("2d",{willReadFrequently:true});cx.imageSmoothingQuality="high";cx.drawImage(src,0,0,W,H);

function runs(arr){const out=[];let c=arr[0],n=0;for(const v of arr){if(v===c)n++;else{out.push([c,n]);c=v;n=1}}out.push([c,n]);return out}
function chartLines(ch){

    for(let d=0;d<ch.W+ch.H-1;d++){const t=[];for(let x=Math.max(0,d-ch.H+1);x<=Math.min(d,ch.W-1);x++){const yb=d-x;t.push(ch.cells[(ch.H-1-yb)*ch.W+x])}

function estimate(ch){

function drawChart(cv,ch,exp){
  const cs=getComputedStyle(document.documentElement),tok=(n,d)=>exp?d:(cs.getPropertyValue(n).trim()||d);
  const ink=tok("--ink","#222"),muted=tok("--muted","#888"),surf=tok("--surface","#fff");

  } else {const r=m.result;if(!r)return;const mm=parseFloat(r.hook);
    p.name=r.title||wt.name;p.hook=HOOKS.find(h=>parseFloat(h)===mm)||m.hook||"";
    p.yarns=(r.yarns||[]).map(y=>({color:y.color||"Yarn",hex:safeHex(y.hex),fiber:"Acrylic",weight:WEIGHTS.find(w=>w===r.yarnWeight)||m.weight,brand:"",skeins:Math.max(1,Math.ceil(num(y.yards)/m.skein)),yards:m.skein}));
    if(!p.yarns.length)p.yarns=blankProject().yarns;
    p.patternText=formatPattern(r);p.notes="AI draft made from a photo. Note any changes you make here.";}
  if(await write("projects",p.id,p)){toast("Saved to your projects");state.tab="projects";state.filter="all";render();draftKind="project";draft=clone(p);draft._new=false;renderSheet()}
}
async function takeFile(f){
  const m=state.make;if(f.type&&!/^image\//.test(f.type)){m.err="Choose an image file, like a JPG or PNG.";render();return}
  const url=URL.createObjectURL(f);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    if(m.url)URL.revokeObjectURL(m.url);Object.assign(m,{img,url,step:2,err:"",chart:null,_key:"",result:null,fixing:null});render()}
  catch(_){URL.revokeObjectURL(url);m.err="That photo couldn't be opened. Try a JPG or PNG.";render()}
}

/* ---- events ---- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-mk-type],[data-act]");if(!t)return;const m=state.make;
  if(t.dataset.mkType){if(m.busy)return;m.type=t.dataset.mkType;m.step=3;m.result=null;m.err="";m.fixing=null;render();goStep();return}
  switch(t.dataset.act){
    case "mkBack":if(m.busy)genCtl?.abort();m.step=Math.max(1,m.step-1);m.err="";render();break;
    case "mkChangePhoto":m.step=1;m.err="";render();break;
    case "mkInvert":m.invert=!m.invert;refreshChart();break;
    case "mkGen":generate();break;
    case "mkStop":genCtl?.abort();break;
    case "mkRegen":m.result=null;m.err="";render();break;
    case "mkSave":t.disabled=true;try{await saveMake()}finally{t.disabled=false}break;
    case "mkFixOpen":m.fixing=t.dataset.s+"-"+t.dataset.i;m.err="";render();$("#fixNote")?.focus();break;
    case "mkFixCancel":fixCtl?.abort();m.fixing=null;render();break;
    case "mkFix":fixStep(+t.dataset.s,+t.dataset.i,($("#fixNote")?.value||"").trim());break;
  }
});
let chartT;
document.addEventListener("input",e=>{const t=e.target,m=state.make;
  if(t.id==="mkW"){m.w=+t.value;$("#mkWv").textContent=m.w;clearTimeout(chartT);chartT=setTimeout(refreshChart,120)}
  else if(t.id==="mkK"){m.k=+t.value;$("#mkKv").textContent=m.k;clearTimeout(chartT);chartT=setTimeout(refreshChart,120)}
  else if(t.id==="mkSkein"){m.skein=Math.max(20,num(t.value)||200);clearTimeout(chartT);chartT=setTimeout(refreshChart,300)}
  else if(t.dataset.m)m[t.dataset.m]=t.value;
});
document.addEventListener("change",e=>{const t=e.target,m=state.make;
  if(t.id==="mkFile"&&t.files&&t.files[0])takeFile(t.files[0]);
  if(t.id==="mkSmooth"){m.smooth=t.checked;refreshChart()}
  if(t.id==="mkWeight"){m.weight=t.value;refreshChart()}
  if(t.id==="mkStyle")m.style=t.checked;
});
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.remove("over");const f=e.dataTransfer.files[0];if(f)takeFile(f)}});
/* ---- backup: export / import (device-saved version) ---- */
function exportData(){
  const blob=new Blob([JSON.stringify({app:"crochet-project-book",version:1,exported:new Date().toISOString(),projects:state.projects,stash:state.stash})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`crochet-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Backup downloaded");
}
async function importData(file){
  try{const d=JSON.parse(await file.text());if(!d||d.app!=="crochet-project-book"||typeof d.projects!=="object")throw 0;
    const before=state;const np=Object.keys(d.projects||{}).length,ns=Object.keys(d.stash||{}).length;
    Object.assign(state.projects,d.projects||{});Object.assign(state.stash,d.stash||{});
    if(lsSave()){render();toast(`Imported ${np} project${np===1?"":"s"} and ${ns} yarn${ns===1?"":"s"}`)}}
  catch(_){toast("That file isn't a Crochet Project Book backup.")}
}
document.addEventListener("click",e=>{const t=e.target.closest('[data-act="exportData"]');if(t)exportData()});
document.addEventListener("change",e=>{if(e.target.id==="importFile"&&e.target.files[0]){importData(e.target.files[0]);e.target.value=""}});
</script>
